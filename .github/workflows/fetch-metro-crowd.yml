name: 🚇 每月更新捷運「此時段通常多擠」資料

on:
  # 每月 20 日台灣時間 03:30（UTC 19 日 19:30）。臺北捷運分時 OD 資料約在次月中旬上架
  # （2026-08 的檔案於 9/13 發布），20 日跑可以拿到上個月的資料。
  schedule:
    - cron: '30 19 19 * *'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-metro-crowd:
    name: 下載分時 OD 流量並計算各區間擁擠度
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 計算 metro_crowd.json
        # 串流下載約 300MB 的月檔（不落地），已是最新月份就直接結束。
        # 有 OD 站名對不到車站時會失敗（非 0 結束），不會提交偏掉的資料。
        run: npm run build-metro-crowd

      - name: 🧪 驗證資料
        run: npm run test:metro-crowd

      - name: 🔍 檢查資料是否有更新
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain public/data/metro_crowd.json)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 📝 Commit & Push
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/metro_crowd.json
          git commit -m "chore: 🚇 更新捷運分時擁擠度 $(node -p "require('./public/data/metro_crowd.json').Month")"
          git push
