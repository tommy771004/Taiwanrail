name: 🚄 每日自動更新 TDX 靜態資料

on:
  # 每天台灣時間 05:00 執行（UTC 21:00），分兩種模式（由下方「決定執行模式」步驟判斷）：
  # - daily：每日時刻表增量更新。只抓現有最新一天的隔天（最新 10/31 → 抓 11/1），
  #   再以最新一天為準保留 14 天、刪掉更舊的（→ 刪 10/18）。漏跑或 TDX 晚發布時
  #   會自動補齊到日期選單最後一天（今天 + 13 天）。
  # - full：另外重抓車站、全週時刻表與票價。這些資料很大又很少變，維持每四天一次
  #   （UTC 日期 1、5、9、13、17、21、25、29 號，與先前 cron */4 相同），不增加 TDX 用量。
  schedule:
    - cron: '0 21 * * *'

  # 允許手動從 GitHub UI 觸發（預設 full）
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = 全部資料；daily = 只做每日時刻表增量更新'
        type: choice
        options:
          - full
          - daily
        default: full

# 同一時間只跑一個，避免兩次執行同時 push 互相衝突
concurrency:
  group: fetch-tdx-data
  cancel-in-progress: false

# 給 GITHUB_TOKEN 寫入權限（push commit 需要）
permissions:
  contents: write

jobs:
  fetch-and-commit:
    name: 抓取 TDX 資料並提交
    runs-on: ubuntu-latest

    steps:
      # 1. 把 repo checkout 下來
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. 設定 Node.js 環境
      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 安裝依賴
      - name: 📦 Install dependencies
        run: npm ci

      # 4. 決定執行模式：手動觸發看輸入值；排程則 UTC 日期 1、5、9 … 29 號跑 full，其餘 daily
      - name: 🧭 決定執行模式
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          elif [ $(( (10#$(date -u +%d) - 1) % 4 )) -eq 0 ]; then
            mode=full
          else
            mode=daily
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "執行模式：$mode"

      # 5. 執行抓取腳本（注入 TDX credentials）
      #    full：車站、全週 GeneralTimetable、每日時刻表增量更新與 ODFare。
      #    daily：只做每日時刻表增量更新。
      - name: 🚀 執行 fetch-tdx-data 腳本
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then
            npm run fetch-data
          else
            npm run fetch-daily
          fi

      # 6. 驗證完整 JSON 與最低資料量，避免部分回應覆寫正式資料
      - name: 🧪 驗證 TDX 資料完整性
        run: npm run verify:data

      # 7. 檢查是否有資料變動
      #    每日時刻表每次都會新增／刪除日期檔案，git diff 看不到 untracked 新檔，
      #    因此用 git status --porcelain 一併涵蓋新增、修改與刪除。
      - name: 🔍 檢查資料是否有更新
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain public/data/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      # 8. 若有更新則 commit 並 push（會觸發 Vercel 自動部署）
      - name: 📝 Commit & Push 更新的資料
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          if [ "${{ steps.mode.outputs.mode }}" = "full" ]; then
            git commit -m "chore: 🚄 自動更新 TDX 靜態資料 $(date -u '+%Y-%m-%d')"
          else
            git commit -m "chore: 📅 每日時刻表增量更新 $(TZ=Asia/Taipei date '+%Y-%m-%d')"
          fi
          # 執行期間若有其他 commit 進來，先 rebase 再 push
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      # 9. 若沒有變動，跳過
      - name: ✅ 資料無變動，跳過 commit
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "資料與上次相同，無需更新。"
