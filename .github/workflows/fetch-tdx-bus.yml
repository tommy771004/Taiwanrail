name: 🚌 每週自動更新 TDX 公車站牌與路線

on:
  # 每週三台灣時間 04:00 執行（UTC 週二 20:00），避開每日鐵路（05:00）與週日捷運（03:00）。
  # 站牌與路線很少變：每個縣市先查一次 DataVersion，版本沒變就跳過（一週約 5 次小呼叫），
  # 變了才抓 Route + StopOfRoute。到站時間是即時查詢，不靠這個排程。
  schedule:
    - cron: '0 20 * * 2'

  # 允許手動從 GitHub UI 觸發；force = 不看 DataVersion，全部縣市重抓
  workflow_dispatch:
    inputs:
      force:
        description: '全部縣市重抓（忽略 DataVersion）'
        type: boolean
        default: false

# 與其他資料排程分開跑，但同一個公車排程不重疊
concurrency:
  group: fetch-tdx-bus
  cancel-in-progress: false

# 給 GITHUB_TOKEN 寫入權限（push commit 需要）
permissions:
  contents: write

jobs:
  fetch-bus-data:
    name: 抓取 TDX 公車資料並提交
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      # 失敗的縣市保留舊檔；成功的縣市照樣提交，最後一步再讓這次執行標成失敗。
      - name: 🚌 更新公車站牌與路線快照
        id: fetch
        continue-on-error: true
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            npm run fetch-bus-data -- --force
          else
            npm run fetch-bus-data
          fi

      # 第一次寫入的縣市檔是 untracked，git diff 看不到，所以用 git status --porcelain。
      - name: 🔍 檢查資料是否有更新
        id: check_changes
        run: |
          if [ -n "$(git status --porcelain public/data/bus/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: 📝 Commit & Push 更新的資料
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/bus/
          git commit -m "chore: 🚌 自動更新 TDX 公車站牌與路線 $(TZ=Asia/Taipei date '+%Y-%m-%d')"
          # 執行期間若鐵路或捷運排程先 push，先 rebase 再 push
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: ✅ 資料無變動，跳過 commit
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "公車資料與上次相同，無需更新。"

      - name: ❌ 有縣市更新失敗
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::部分縣市的公車資料抓取失敗，已保留舊檔；詳見上方「更新公車站牌與路線快照」步驟。"
          exit 1
